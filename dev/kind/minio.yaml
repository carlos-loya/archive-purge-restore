---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: data
  labels:
    app: minio
spec:
  replicas: 1
  selector:
    matchLabels: { app: minio }
  template:
    metadata:
      labels: { app: minio }
    spec:
      containers:
        - name: minio
          image: minio/minio:RELEASE.2025-04-22T22-12-26Z
          args: ["server", "/data", "--console-address", ":9001"]
          env:
            - name: MINIO_ROOT_USER
              value: minioadmin
            - name: MINIO_ROOT_PASSWORD
              value: minioadmin
          ports:
            - containerPort: 9000
              name: api
            - containerPort: 9001
              name: console
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: api
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: data
spec:
  type: NodePort
  selector: { app: minio }
  ports:
    - port: 9000
      targetPort: 9000
      nodePort: 30900
      name: api
---
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-bucket-init
  namespace: data
spec:
  backoffLimit: 30
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mc
          image: minio/mc:RELEASE.2025-04-16T18-13-26Z
          command:
            - sh
            - -c
            - |
              set -e
              until mc alias set local http://minio:9000 minioadmin minioadmin >/dev/null 2>&1; do
                echo "waiting for MinIO..."
                sleep 2
              done
              mc mb -p local/test-archive
              mc anonymous set public local/test-archive
              mc ls local/test-archive
              echo "bucket ready"
