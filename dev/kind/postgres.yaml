---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: data
data:
  # Seed schema and data. Half the rows are >180 days old so they will be
  # picked up by an ArchiveRule with daysOnline=90; the other half are
  # recent and should remain after archive.
  init.sql: |
    CREATE TABLE orders (
      id          SERIAL PRIMARY KEY,
      customer    TEXT NOT NULL,
      total       NUMERIC(10,2) NOT NULL,
      created_at  TIMESTAMP NOT NULL DEFAULT NOW()
    );

    INSERT INTO orders (customer, total, created_at)
    SELECT
      'customer-' || g,
      (random() * 1000)::numeric(10,2),
      NOW() - INTERVAL '200 days' + (g || ' days')::interval
    FROM generate_series(1, 50) g;

    -- Recent rows: last 30 days
    INSERT INTO orders (customer, total, created_at)
    SELECT
      'customer-recent-' || g,
      (random() * 1000)::numeric(10,2),
      NOW() - (g || ' days')::interval
    FROM generate_series(1, 50) g;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: data
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_PASSWORD
              value: postgres
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: orders
          ports:
            - containerPort: 5432
              name: postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            periodSeconds: 2
          volumeMounts:
            - name: init
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: data
spec:
  type: NodePort
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
      nodePort: 30432
      name: postgres
