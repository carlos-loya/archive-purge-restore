kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: apr-test
nodes:
  - role: control-plane
    extraPortMappings:
      # Postgres NodePort → host:15432. The integration test connects
      # here for row-count assertions.
      - containerPort: 30432
        hostPort: 15432
        protocol: TCP
      # MinIO API NodePort → host:19000. Used by the integration test
      # to verify Parquet files landed in the bucket.
      - containerPort: 30900
        hostPort: 19000
        protocol: TCP
