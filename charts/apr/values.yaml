# -- Container image used for both the manager Deployment and the spawned
# archive/restore Job pods. The image must contain `/apr-manager` and `/apr`.
image:
  repository: ghcr.io/carlos-loya/archive-purge-restore
  tag: "" # defaults to .Chart.AppVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

# -- Number of manager replicas. Use >1 with leaderElection.enabled=true for HA.
replicaCount: 1

leaderElection:
  enabled: false

# -- Manager log verbosity (controller-runtime zap logger).
log:
  level: info     # debug | info | error
  development: false

manager:
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi

  # -- Address the manager binds for /metrics. Set to "0" to disable.
  metricsBindAddress: ":8080"

  # -- Address the manager binds for /healthz, /readyz.
  healthProbeBindAddress: ":8081"

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]

# -- Configuration applied to every Job pod the manager spawns to run an
# archive or restore against a CR.
runner:
  serviceAccount:
    name: apr-runner

# -- Service exposing the manager's /metrics endpoint. Disable if you don't
# scrape metrics or run a separate ServiceMonitor.
metricsService:
  enabled: true
  port: 8080

# -- Prometheus integration. When enabled, ships a ServiceMonitor that
# Prometheus Operator picks up automatically. Requires the Prometheus
# Operator CRDs to be installed in the cluster (kube-prometheus-stack
# or similar).
prometheus:
  enabled: false
  serviceMonitor:
    # interval and scrapeTimeout follow Prometheus defaults if empty.
    interval: 30s
    scrapeTimeout: 10s
    # Extra labels added to the ServiceMonitor object. Prometheus
    # Operator typically requires a label like `release: kube-prom-stack`
    # to discover ServiceMonitors — set that here.
    labels: {}

# -- Validating admission webhooks. Disabled by default because they
# require a TLS cert, which we mint via cert-manager when enabled. If
# you'd rather supply your own cert (e.g. from a different issuer or
# a long-lived Secret), set certManager.enabled=false and provide
# certSecretName.
webhooks:
  enabled: false
  port: 9443
  failurePolicy: Fail   # Fail | Ignore — Fail is safer (rejects bad CRs)
  certManager:
    enabled: true
    # Issuer kind to use. "Issuer" is namespace-scoped; "ClusterIssuer"
    # is cluster-scoped. Self-signed Issuer in the release namespace is
    # fine for most installs.
    issuerKind: Issuer
    issuerName: ""      # auto-created when empty
  # If certManager.enabled=false, point at a pre-existing Secret with
  # tls.crt + tls.key + ca.crt. Required keys match the cert-manager
  # default Certificate output format.
  certSecretName: ""

# -- Selectors that schedule the manager pod. Job pods spawned by the
# operator inherit no scheduling constraints by default.
nodeSelector: {}
tolerations: []
affinity: {}
