{{/*
The runner ServiceAccount must exist in every namespace that hosts an
ArchiveRule or RestoreRequest. This template creates it in the operator's
release namespace; when users want to run archives in other namespaces,
they create their own SA with the same name (or use the example manifests
under docs/examples/).
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "apr.runnerServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apr.labels" . | nindent 4 }}
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
