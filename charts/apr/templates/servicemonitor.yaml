{{- if and .Values.prometheus.enabled .Values.metricsService.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "apr.fullname" . }}-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apr.labels" . | nindent 4 }}
    app.kubernetes.io/component: manager
    {{- with .Values.prometheus.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  selector:
    matchLabels:
      {{- include "apr.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: manager
  endpoints:
    - port: metrics
      path: /metrics
      {{- with .Values.prometheus.serviceMonitor.interval }}
      interval: {{ . }}
      {{- end }}
      {{- with .Values.prometheus.serviceMonitor.scrapeTimeout }}
      scrapeTimeout: {{ . }}
      {{- end }}
{{- end }}
