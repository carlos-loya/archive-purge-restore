apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "apr.fullname" . }}-runner
  labels:
    {{- include "apr.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "apr.fullname" . }}-runner
subjects:
  - kind: ServiceAccount
    name: {{ include "apr.runnerServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
