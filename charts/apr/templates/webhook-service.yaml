{{- if .Values.webhooks.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "apr.fullname" . }}-webhook
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "apr.labels" . | nindent 4 }}
    app.kubernetes.io/component: webhook
spec:
  type: ClusterIP
  ports:
    - name: webhook
      port: 443
      targetPort: webhook
      protocol: TCP
  selector:
    {{- include "apr.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: manager
{{- end }}
