    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          RestoreRequest is a one-shot request to restore previously archived rows
          back to the source database.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
